name: Market Data Fetcher

on:
  schedule:
    # Runs at minute 0 past every 2nd hour (e.g., 00:00, 02:00, 04:00)
    - cron: '0 */2 * * *'
  workflow_dispatch: 
    # Allows you to click a "Run workflow" button manually in GitHub

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # No pip install needed since we use standard libraries
      - name: Run Market Data Fetcher
        run: python fetch_ticks.py

      - name: Deploy to GitHub Pages (Orphan Branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_data
          force_orphan: true
          commit_message: "Automated market data update"
          
